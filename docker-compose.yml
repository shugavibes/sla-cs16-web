name: cs16-custom

# Servicios:
#   servidor -> las salas: un servidor dedicado de CS 1.6 por línea de config/salas.conf
#               (Xash3D FWGS + ReGameDLL + bots YaPB), Linux 32 bits
#   web      -> página del juego + puente WebRTC <-> UDP (las salas usan su red)
#   studio   -> estudio de personajes, siempre solo en esta compu
#   caddy    -> HTTPS para el modo online (./start.sh online)
#   steamcmd -> solo para bajar los archivos del juego; lo usa start.sh
#
# start.sh escribe en .env en qué direcciones escucha cada cosa según el modo:
#   local  -> todo en 127.0.0.1 (nadie más puede entrar)
#   lan    -> la página y el juego en la IP de la red local
#   online -> la página detrás de Caddy (HTTPS) y el juego (UDP 27018) abierto a internet

services:
  servidor:
    build: ./servidor
    platform: linux/amd64   # con bibliotecas de 32 bits: el servidor de CS es i386
    restart: unless-stopped
    environment:
      NOMBRE_SERVIDOR: "${NOMBRE_SERVIDOR:-CS 1.6}"
      MAPA: "${MAPA:-de_dust2}"
      MAX_JUGADORES: "${MAX_JUGADORES:-12}"
      BOTS: "${BOTS:-4}"
      BOTS_DIFICULTAD: "${BOTS_DIFICULTAD:-0}"
    volumes:
      - ./build/juego:/juego:ro
      - ./config/server.cfg:/config/server.cfg:ro
      - ./config/mapcycle.txt:/config/mapcycle.txt:ro
      - ./config/motd.txt:/config/motd.txt:ro
      - ./config/salas.conf:/config/salas.conf:ro
      - ./mapas:/mapas:ro          # mapas de la comunidad (se suman a cada sala)
    # Comparte la red de "web": así el puente le habla por 127.0.0.1 y cada jugador
    # llega con su propia IP de loopback (el servidor de CS los distingue por IP).
    network_mode: "service:web"
    depends_on:
      - web
    stdin_open: true   # permite ver la consola con: docker attach cs16-custom-servidor-1
    tty: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: "${SERVIDOR_MEMORIA:-1536m}"   # unos 150 MB por sala
    pids_limit: 1024

  web:
    build: ./web
    restart: unless-stopped
    ports:
      - "${BIND_WEB:-127.0.0.1}:27016:27016/tcp"   # página del juego
      - "${BIND_UDP:-127.0.0.1}:27018:27018/udp"   # tráfico del juego (WebRTC)
    environment:
      IP_PUBLICA: "${IP_PUBLICA:-127.0.0.1}"
      URL_JUEGO: "${URL_JUEGO:-}"   # dirección pública (online); la usa la página si llega por Vercel
      NOMBRE_SERVIDOR: "${NOMBRE_SERVIDOR:-CS 1.6}"
      MAPA: "${MAPA:-de_dust2}"
      MAX_JUGADORES: "${MAX_JUGADORES:-12}"
      RCON_PASSWORD: "${RCON_PASSWORD:-}"
      CONTRASENA: "${CONTRASENA:-}"
      ARCHIVOS: "${ARCHIVOS:-servidor}"
      CONFIAR_PROXY: "${CONFIAR_PROXY:-0}"
      MAX_POR_IP: "${MAX_POR_IP:-4}"
      CLAVE_ESTADISTICAS: "${CLAVE_ESTADISTICAS:-}"   # clave de /estadisticas (la genera start.sh)
      METRICAS: /data/metricas
      DATOS: /data/build
      MARCA: /data/marca/web
      SALAS: /config/salas.conf
    volumes:
      - ./build:/data/build:ro
      - ./marca:/data/marca:ro              # logo, colores y textos de la página: se ven al recargar
      - ./web/cliente:/app/cliente:ro       # salas, equipo, archivos propios, manos: idem
      - ./config/salas.conf:/config/salas.conf:ro
      - ./metricas:/data/metricas           # cuánta gente entra (lo único que la web escribe)
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m

  studio:
    build: ./studio
    restart: unless-stopped
    user: "${HOST_UID:-10001:10001}"   # mismo usuario que en tu compu, para escribir en build/ y texturas/
    environment:
      ESTUDIO_URL_JUEGO: "${URL_JUEGO:-http://localhost:27016}"
    volumes:
      - ./build:/data/build
      - ./texturas:/data/texturas
      - ./marca:/data/marca:ro     # marca/juego/* se suma tal cual a valve.zip y mod.zip
      - ./mapas:/data/mapas:ro     # mapas de la comunidad: idem
    ports:
      - "127.0.0.1:27080:8080"   # el estudio nunca se expone a la red
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g

  caddy:
    image: caddy:2-alpine
    profiles: ["online"]
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMINIO: "${DOMINIO_CADDY:-localhost}"   # lo pone start.sh: tu dominio (y el link <ip>.sslip.io)
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-datos:/data
      - caddy-config:/config

  steamcmd:
    build: ./steamcmd
    platform: linux/386
    profiles: ["descarga"]
    volumes:
      - ./build/descarga:/descarga
      - steamcmd-cache:/home/steam   # SteamCMD se actualiza solo; así no se baja de nuevo cada vez
    security_opt:
      - no-new-privileges:true

volumes:
  steamcmd-cache:
  caddy-datos:
  caddy-config:
